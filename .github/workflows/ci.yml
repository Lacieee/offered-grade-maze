name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, format (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # Server integration tests need PostgreSQL; fail instead of skipping.
      OGM_REQUIRE_DB: 1
      TEST_DATABASE_URL: postgres://ogm:ogm@localhost:5432/ogm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogm
          POSTGRES_PASSWORD: ogm
          POSTGRES_DB: ogm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogm -d ogm" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: OpenAPI up to date
        run: |
          pnpm --filter @ogm/server openapi
          git diff --exit-code docs/api/openapi.json

      - name: Generator sweeps (10 000 seeds per difficulty, CP04)
        run: |
          for d in easy medium hard; do pnpm gen sweep --difficulty "$d" --count 10000; done
          pnpm gen golden

  e2e:
    name: Playwright (portals and visual baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @ogm/e2e exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker image and local stack (PD4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (docker compose up --build)
        run: docker compose up --build --detach --wait

      - name: Health check reports the database
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee health.json
          grep -q '"db":"ok"' health.json
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
